<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채널 승인 — 인비랩</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .admin-note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:16px 20px;font-size:17px;color:var(--blue-dark);margin-bottom:20px;line-height:1.6;}
  .counts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .count-box{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;}
  .count-box b{display:block;font-size:30px;color:var(--ink);}
  .count-box span{font-size:15.5px;color:var(--sub);}

  .filter-bar{background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
  .filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .filter-row .flabel{font-size:15.5px;font-weight:700;color:var(--sub);width:74px;flex-shrink:0;}
  .fbtn{padding:7px 15px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15.5px;font-weight:700;cursor:pointer;color:var(--sub);font-family:inherit;}
  .fbtn.on{border-color:var(--blue);color:var(--blue);background:#eff6ff;}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;}
  .card-head{display:flex;align-items:center;gap:14px;}
  .card-head img{width:60px;height:60px;border-radius:50%;object-fit:cover;background:var(--bg-soft);flex-shrink:0;}
  .card-head .nm{font-size:20px;font-weight:800;}
  .card-head .meta{font-size:15.5px;color:var(--sub);margin-top:2px;}
  .conf{display:inline-block;font-size:14px;font-weight:800;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:middle;}
  .conf.상{background:#dcfce7;color:#166534;}
  .conf.중{background:#fef9c3;color:#854d0e;}
  .conf.하{background:#fee2e2;color:#991b1b;}
  .genre-tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:#eff6ff;color:var(--blue-dark);margin-left:8px;vertical-align:middle;}
  .src-badge{display:inline-block;font-size:14px;font-weight:800;padding:2px 10px;border-radius:999px;background:#fef3c7;color:#92400e;margin-left:8px;vertical-align:middle;}
  .reason{background:var(--bg-soft);border-radius:12px;padding:12px 16px;font-size:16.5px;color:var(--ink);margin:14px 0;line-height:1.55;}
  .reason b{color:var(--blue-dark);}
  .vids{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
  .vids a{display:block;position:relative;width:112px;height:199px;border-radius:12px;overflow:hidden;background:#000;flex-shrink:0;box-shadow:0 1px 4px rgba(15,23,42,.12);}
  .vids img{width:100%;height:100%;object-fit:cover;display:block;}
  .vids .vt{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-size:13.5px;font-weight:800;text-align:center;padding:16px 4px 6px;}
  .card-actions{display:flex;gap:12px;margin-top:8px;}
  .card-actions .btn{flex:1;text-align:center;}
  .status-badge{font-size:16px;font-weight:800;padding:8px 0;text-align:center;border-radius:12px;}
  .status-badge.승인{background:#dcfce7;color:#166534;}
  .status-badge.제외{background:#fee2e2;color:#991b1b;}
  .empty{padding:50px 0;text-align:center;color:var(--sub);font-size:18px;}
  .noperm{padding:70px 20px;text-align:center;}
  .noperm h2{font-size:26px;margin-bottom:10px;}
  .noperm p{font-size:18px;color:var(--sub);}
</style>
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div class="wrap" id="wrap">
    <h1 class="page-title">채널 승인 🛠️</h1>
    <p class="page-desc">AI가 가져온 50만 구독자 미만의 채널입니다. 관리자님께서는 수강생에게 보여줄 채널에 대해 ✓승인/✗제외만 눌러주세요.</p>

    <div id="content"><p class="empty">확인하는 중...</p></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  function fmtNum(n) {
    n = Number(n || 0);
    if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "억";
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "만";
    return n.toLocaleString();
  }

  // 영상 썸네일: 숏츠는 세로형(oardefault), 일반 영상은 가로형(hqdefault)
  function vthumbSrc(v) {
    return `https://i.ytimg.com/vi/${v.video_id}/${v.is_short ? "oardefault" : "hqdefault"}.jpg`;
  }
  window.vthumbFallback = function (img, id) {
    if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"; }
    else { img.style.visibility = "hidden"; }
  };

  const filters = { conf: "", status: "대기" }; // 기본: 대기중, 확신도 전체
  let allRows = [];
  let videosByChannel = {};

  async function fetchRows() {
    // 승인 후보: 튜브랩에서 가져온 채널 + AI가 편집형이라 본 채널 (모두 50만 미만)
    const { data } = await sb.from("channels")
      .select("id,title,thumbnail,subscriber_count,ai_confidence,ai_reason,ai_genre,admin_status,source")
      .lt("subscriber_count", 500000)
      .or("source.eq.tubelab,ai_faceless.eq.true")
      .order("subscriber_count", { ascending: false })
      .limit(500);
    allRows = data || [];
  }

  async function fetchVideosFor(ids) {
    const need = ids.filter((id) => !(id in videosByChannel));
    for (let i = 0; i < need.length; i += 50) {
      const part = need.slice(i, i + 50);
      const { data } = await sb.from("channel_videos")
        .select("channel_id,video_id,title,thumbnail,view_count,is_short")
        .in("channel_id", part)
        .order("view_count", { ascending: false })
        .limit(part.length * 8);
      part.forEach((id) => { videosByChannel[id] = videosByChannel[id] || []; });
      (data || []).forEach((v) => {
        (videosByChannel[v.channel_id] = videosByChannel[v.channel_id] || []).push(v);
      });
    }
  }

  async function setStatus(id, status) {
    const { error } = await sb.from("channels").update({ admin_status: status }).eq("id", id);
    if (error) { alert("변경 실패: " + error.message); return; }
    const row = allRows.find((r) => r.id === id);
    if (row) row.admin_status = status;
    render();
  }
  window.setStatus = setStatus;

  // 채널 완전 삭제 (관리자 전용 · RLS로 서버에서도 관리자만 허용)
  async function delChannel(id) {
    const row = allRows.find((r) => r.id === id);
    const title = row ? row.title : "이 채널";
    if (!confirm(`'${title}' 채널을 목록에서 완전히 삭제할까요?\n\n삭제하면 승인·검토 목록과 수강생 화면에서 모두 사라집니다.\n(다시 필요하면 나중에 새로 수집됩니다.)`)) return;
    const { error } = await sb.from("channels").delete().eq("id", id);
    if (error) { alert("삭제 실패: " + error.message); return; }
    allRows = allRows.filter((r) => r.id !== id);
    render();
  }
  window.delChannel = delChannel;

  function counts() {
    const c = { 대기: 0, 승인: 0, 제외: 0 };
    allRows.forEach((r) => { c[r.admin_status || "대기"] = (c[r.admin_status || "대기"] || 0) + 1; });
    return c;
  }

  function render() {
    const box = $id("content");
    const c = counts();

    // 필터 적용
    let rows = allRows.slice();
    if (filters.status) rows = rows.filter((r) => (r.admin_status || "대기") === filters.status);
    if (filters.conf) rows = rows.filter((r) => r.ai_confidence === filters.conf);

    const head = `
      <div class="counts">
        <div class="count-box"><b>${c.대기}</b><span>검토 대기</span></div>
        <div class="count-box"><b>${c.승인}</b><span>승인됨</span></div>
        <div class="count-box"><b>${c.제외}</b><span>제외됨</span></div>
      </div>
      <div class="filter-bar">
        <div class="filter-row" style="margin-bottom:10px">
          <span class="flabel">상태</span>
          <button class="fbtn ${filters.status === "대기" ? "on" : ""}" data-f="status" data-v="대기">검토 대기</button>
          <button class="fbtn ${filters.status === "승인" ? "on" : ""}" data-f="status" data-v="승인">승인됨</button>
          <button class="fbtn ${filters.status === "제외" ? "on" : ""}" data-f="status" data-v="제외">제외됨</button>
          <button class="fbtn ${filters.status === "" ? "on" : ""}" data-f="status" data-v="">전체</button>
        </div>
        <div class="filter-row">
          <span class="flabel">확신도</span>
          <button class="fbtn ${filters.conf === "" ? "on" : ""}" data-f="conf" data-v="">전체</button>
          <button class="fbtn ${filters.conf === "상" ? "on" : ""}" data-f="conf" data-v="상">상</button>
          <button class="fbtn ${filters.conf === "중" ? "on" : ""}" data-f="conf" data-v="중">중</button>
          <button class="fbtn ${filters.conf === "하" ? "on" : ""}" data-f="conf" data-v="하">하</button>
        </div>
      </div>`;

    if (rows.length === 0) {
      box.innerHTML = head + '<p class="empty">이 조건에 해당하는 채널이 없습니다. 👍</p>';
      bindFilters();
      return;
    }

    box.innerHTML = head + rows.map((r) => {
      const vids = (videosByChannel[r.id] || []).slice(0, 5);
      const st = r.admin_status || "대기";
      const actions = st === "대기"
        ? `<div class="card-actions">
             <button class="btn btn-main" onclick="setStatus('${r.id}','승인')">✓ 승인 (수강생에게 보이기)</button>
             <button class="btn btn-danger" onclick="setStatus('${r.id}','제외')">✗ 제외</button>
           </div>`
        : `<div class="status-badge ${st}">${st === "승인" ? "✓ 승인됨 — 수강생에게 노출 중" : "✗ 제외됨"}</div>
           <div class="card-actions" style="margin-top:10px">
             <button class="btn btn-ghost btn-sm" onclick="setStatus('${r.id}','대기')">↩ 다시 검토 대기로</button>
             ${st === "승인"
               ? `<button class="btn btn-ghost btn-sm" onclick="setStatus('${r.id}','제외')">✗ 제외로 변경</button>`
               : `<button class="btn btn-ghost btn-sm" onclick="setStatus('${r.id}','승인')">✓ 승인으로 변경</button>`}
           </div>`;
      return `
      <div class="card">
        <div class="card-head">
          <img src="${escapeHtml(r.thumbnail)}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="nm">
              ${escapeHtml(r.title)}
              ${r.source === "tubelab" ? `<span class="src-badge">튜브랩</span>` : ""}
              ${r.ai_confidence ? `<span class="conf ${r.ai_confidence}">확신 ${r.ai_confidence}</span>` : ""}
              ${r.ai_genre ? `<span class="genre-tag">${escapeHtml(r.ai_genre)}</span>` : ""}
            </div>
            <div class="meta">구독자 ${fmtNum(r.subscriber_count)}명
              · <a href="channel.html?id=${r.id}" target="_blank">채널 분석 열기</a></div>
          </div>
        </div>
        ${r.ai_reason ? `<div class="reason"><b>AI 판단:</b> ${escapeHtml(r.ai_reason)}</div>` : ""}
        <div class="vids">
          ${vids.map((v) => `
            <a href="https://www.youtube.com/${v.is_short ? "shorts/" : "watch?v="}${v.video_id}" target="_blank" title="${escapeHtml(v.title)}">
              <img src="${vthumbSrc(v)}" alt="" loading="lazy" onerror="vthumbFallback(this,'${v.video_id}')">
              <span class="vt">${fmtNum(v.view_count)}회</span>
            </a>`).join("") || '<span style="color:var(--sub);font-size:15px">최근 영상 자료 없음</span>'}
        </div>
        ${actions}
        <div style="text-align:right;margin-top:10px">
          <button class="btn btn-ghost btn-sm" style="color:#991b1b" onclick="delChannel('${r.id}')">🗑 완전 삭제</button>
        </div>
      </div>`;
    }).join("");
    bindFilters();
  }

  function bindFilters() {
    document.querySelectorAll(".fbtn").forEach((btn) => {
      btn.addEventListener("click", function () {
        filters[this.dataset.f] = this.dataset.v;
        render();
      });
    });
  }

  (async function () {
    await renderHeader("admin");
    renderFooter();
    const user = await requireLogin();
    if (!sb || !user) return;

    // 관리자만 접근
    if (!(await isAdmin(user))) {
      $id("wrap").innerHTML = `
        <div class="noperm">
          <h2>🔒 관리자 전용 화면입니다</h2>
          <p>이 페이지는 인비랩 운영자만 볼 수 있어요.</p>
          <p style="margin-top:16px"><a class="btn btn-main" href="dashboard.html">홈으로 돌아가기</a></p>
        </div>`;
      return;
    }

    await fetchRows();
    // 대기중 채널의 영상 미리 로드
    await fetchVideosFor(allRows.map((r) => r.id));
    render();
  })();
</script>
</body>
</html>
