<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<title>오늘 뜨는 채널 — 인비랩</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* 영상 랭킹 공통 */
  .rank-item{display:flex;align-items:center;gap:18px;padding:18px 8px;border-bottom:1px solid var(--line);}
  .rank-item:hover{background:#f8fafc;}
  .rank-no{font-size:22px;font-weight:800;color:var(--blue);width:44px;text-align:center;flex-shrink:0;}
  .rank-thumb{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg-soft);}
  .rank-thumb.video{width:120px;height:68px;border-radius:10px;}
  .rank-main{flex:1;min-width:0;}
  .rank-main .name{font-size:20px;font-weight:700;cursor:pointer;}
  .rank-main .name:hover{color:var(--blue);}
  .rank-main .sub{font-size:16.5px;color:var(--sub);margin-top:2px;}
  .rank-right{text-align:right;flex-shrink:0;}
  .rank-right b{display:block;font-size:19px;color:var(--ink);}
  .rank-right .lbl{font-size:14.5px;color:var(--sub);}
  .update-info{font-size:16px;color:var(--sub);margin-bottom:14px;}

  /* 채널 랭킹 (튜브랩식) — 한 줄 컴팩트 */
  .list-head{display:flex;align-items:center;gap:16px;padding:10px 8px;border-bottom:2px solid var(--line);font-size:13.5px;font-weight:800;color:var(--sub);}
  .list-head .h-rank{width:40px;text-align:center;flex-shrink:0;}
  .list-head .h-ch{flex:1;min-width:210px;}
  .list-head .h-stats{width:132px;text-align:right;flex-shrink:0;}
  .list-head .h-vids{width:430px;text-align:center;flex-shrink:0;}
  .ch-row{display:flex;align-items:center;gap:16px;padding:14px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .ch-row:hover{background:#f8fafc;}
  .rank-no{width:40px;}
  .ch-info{display:flex;align-items:center;gap:12px;min-width:210px;flex:1;}
  .ch-info img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--bg-soft);flex-shrink:0;}
  .ch-name{font-size:16.5px;font-weight:700;cursor:pointer;}
  .ch-name:hover{color:var(--blue);}
  .ch-meta{font-size:13.5px;color:var(--sub);margin-top:2px;}
  .grade{display:inline-block;min-width:24px;text-align:center;font-size:13px;font-weight:800;color:#fff;border-radius:7px;padding:1px 6px;margin-right:5px;vertical-align:middle;}
  .grade.S{background:#f59e0b}.grade.A{background:#2563eb}.grade.B{background:#16a34a}.grade.C{background:#64748b}.grade.D{background:#cbd5e1;color:#475569}
  .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:#eff6ff;color:var(--blue-dark);margin-left:5px;vertical-align:middle;}
  .ch-stats{text-align:right;width:132px;flex-shrink:0;}
  .ch-stats .views{font-size:19px;font-weight:800;color:var(--ink);}
  .ch-stats .lbl{font-size:11.5px;color:var(--sub);}
  .ch-stats .money{font-size:16px;font-weight:800;color:#16a34a;margin-top:3px;}
  .ch-videos{display:flex;gap:6px;justify-content:flex-start;width:430px;flex-shrink:0;}
  .ch-videos a{display:block;position:relative;width:81px;height:144px;border-radius:8px;overflow:hidden;background:#000;flex-shrink:0;box-shadow:0 1px 3px rgba(15,23,42,.12);}
  .ch-videos img{width:100%;height:100%;object-fit:cover;display:block;}
  .ch-videos .v{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-size:11px;font-weight:800;text-align:center;padding:12px 2px 4px;}
  .ch-videos .vrank{position:absolute;top:4px;left:4px;min-width:18px;height:18px;line-height:18px;padding:0 3px;text-align:center;font-size:11px;font-weight:900;color:#fff;background:rgba(15,23,42,.82);border-radius:6px;}
  .ch-videos .vrank.top{background:#f59e0b;}
  .ch-videos a.center{outline:2px solid #f59e0b;outline-offset:-2px;}
  /* 필터 바 */
  .filter-bar{background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
  .filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .filter-row:last-child{margin-bottom:0;}
  .filter-row .flabel{font-size:15.5px;font-weight:700;color:var(--sub);width:74px;flex-shrink:0;}
  .fbtn{padding:7px 15px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15.5px;font-weight:700;cursor:pointer;color:var(--sub);font-family:inherit;}
  .fbtn.on{border-color:var(--blue);color:var(--blue);background:#eff6ff;}
  .fbtn.cat{font-size:14px;padding:6px 12px;}
  .genre-tag{display:inline-block;font-size:13.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#f0fdf4;color:#166534;margin-left:6px;vertical-align:middle;}
  /* 관리자 전용 채널 제어 (수강생에게는 보이지 않음) */
  .admin-ctrl{width:100%;display:flex;justify-content:flex-end;gap:8px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line);}
  .admin-ctrl button{padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);}
  .admin-ctrl button.del{color:#991b1b;border-color:#fecaca;}
  .admin-ctrl .cat-sel{padding:4px 8px;border-radius:8px;border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--sub);font-family:inherit;background:#fff;cursor:pointer;}
  .admin-ctrl .lock-mark{font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:999px;padding:2px 8px;font-weight:700;}
  .pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:22px 0 6px;flex-wrap:wrap;}
  .pager button{min-width:38px;height:38px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit;}
  .pager button.on{border-color:var(--blue);background:var(--blue);color:#fff;}
  .pager button:disabled{opacity:.35;cursor:default;}
  .pager .pinfo{font-size:13.5px;color:var(--sub);margin-left:8px;font-weight:700;}
  @media(max-width:940px){.ch-videos,.list-head .h-vids{display:none;}}
</style>
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div class="wrap">
    <h1 class="page-title">오늘 뜨는 채널 🚀</h1>
    <p class="page-desc">매일 새벽 자동으로 갱신되는 대한민국 급상승 채널과 인기 영상입니다.</p>

    <div class="board-tools">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="channels">뜨는 채널</button>
        <button class="tab" data-tab="videos">인기 영상</button>

        <span class="flabel">채널 유형</span>

        <button class="fbtn" data-f="type" data-v="혼합">혼합</button>

        <span class="flabel">구독자</span>
        <button class="fbtn on" data-f="subs" data-v="">전체</button>
        <button class="fbtn" data-f="subs" data-v="0-10000">1만↓</button>

      </div>

        <button class="fbtn cat on" data-f="category" data-v="">전체</button>
        <button class="fbtn cat" data-f="category" data-v="영화·드라마 요약">영화·드라마 요약</button>
        <button class="fbtn cat" data-f="category" data-v="연예 이슈">연예 이슈</button>
        <button class="fbtn cat" data-f="category" data-v="유머·밈·바이럴">유머·밈·바이럴</button>
        <button class="fbtn cat" data-f="category" data-v="지식·역사·교양">지식·역사·교양</button>
        <button class="fbtn cat" data-f="category" data-v="스포츠">스포츠</button>
        <button class="fbtn cat" data-f="category" data-v="정치·시사">정치·시사</button>
        <button class="fbtn cat" data-f="category" data-v="국뽕·해외반응">국뽕·해외반응</button>
        <button class="fbtn cat" data-f="category" data-v="방송·예능">방송·예능</button>
        <button class="fbtn cat" data-f="category" data-v="동물·펫">동물·펫</button>
        <button class="fbtn cat" data-f="category" data-v="게임">게임</button>
        <button class="fbtn cat" data-f="category" data-v="음악">음악</button>
        <button class="fbtn cat" data-f="category" data-v="썰·사연·애니툰">썰·사연·애니툰</button>
        <button class="fbtn cat" data-f="category" data-v="푸드">푸드</button>
        <button class="fbtn cat" data-f="category" data-v="랭킹·순위 정보">랭킹·순위 정보</button>

    <div class="panel">
      <div class="update-info" id="update-info"></div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // ---------- 도우미 ----------
  function fmtNum(n) {
    n = Number(n || 0);
    if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "억";
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "만";
    return n.toLocaleString();
  }
  function fmtWon(n) {
    n = Math.round(Number(n || 0));
    if (n >= 100000000) return (n / 100000000).toFixed(1) + "억원";
    if (n >= 10000) return Math.round(n / 10000).toLocaleString() + "만원";
    return n.toLocaleString() + "원";
  }
  // 등급: 일일 조회수 증가 기준 (자체 기준)
  function gradeOf(dv) {
    if (dv == null) return "";
    if (dv >= 5000000) return "S";
    if (dv >= 1000000) return "A";
    if (dv >= 300000) return "B";
    if (dv >= 100000) return "C";
    return "D";
  }
  // 예상 수익: 일일 조회수 증가 × 유형별 추정 단가(원/조회수)
  const RATE = { "숏폼": 0.15, "혼합": 0.8, "롱폼": 2.5, "": 0.8 };

  // 영상 썸네일: 숏츠는 세로형(oardefault), 일반 영상은 가로형(hqdefault)
  function vthumbSrc(v) {
    return `https://i.ytimg.com/vi/${v.video_id}/${v.is_short ? "oardefault" : "hqdefault"}.jpg`;
  }
  // 세로 썸네일이 없으면 가로 썸네일로 대체
  window.vthumbFallback = function (img, id) {
    if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"; }
    else { img.style.visibility = "hidden"; }
  };
  // 조회수 1등을 정중앙에, 2·3·4·5등을 좌우로 번갈아 배치 (순위 배지 부여)
  function centerRank(vids) {
    const ranked = vids.map((v, i) => ({ ...v, rank: i + 1 }));
    const left = [], right = [];
    ranked.forEach((v, i) => {
      if (i === 0) return;           // 1등은 가운데
      if (i % 2 === 1) right.push(v); // 2·4등 → 오른쪽
      else left.unshift(v);          // 3·5등 → 왼쪽(가까운 쪽부터)
    });
    return ranked.length ? [...left, ranked[0], ...right] : [];
  }

  let allChannels = [];       // 서버에서 받아온 채널
  let videosByChannel = {};   // 채널별 최근 영상
  const filters = { type: "", subs: "", sort: "daily_views", category: "" };
  let page = 1;               // 현재 페이지
  const PAGE_SIZE = 50;       // 페이지당 채널 수

  // ---------- 채널 데이터 로드 ----------
  // 수강생 화면은 '조회수 증가' 상위 2,000위까지만 표시.
  // 2,000위 밖 채널은 삭제가 아니라 자동 숨김 — 다시 성장해 순위에 들면 자동 복귀.
  async function fetchChannels() {
    const { data } = await sb.from("channels")
      .select("id,title,thumbnail,subscriber_count,daily_views,daily_subs,stats_date,ai_genre,admin_status,category,category_locked")
      .eq("admin_status", "승인")
      .lt("subscriber_count", 500000)
      .gte("subscriber_count", 500)
      .order("daily_views", { ascending: false, nullsFirst: false })
      .limit(2000);
    allChannels = data || [];
  }

  async function fetchVideosFor(ids) {
    const need = ids.filter((id) => !(id in videosByChannel));
    for (let i = 0; i < need.length; i += 60) {
      const part = need.slice(i, i + 60);
      const { data } = await sb.from("channel_videos")
        .select("channel_id,video_id,title,thumbnail,view_count,is_short")
        .in("channel_id", part)
        .order("view_count", { ascending: false })
        .limit(part.length * 10);
      part.forEach((id) => { videosByChannel[id] = videosByChannel[id] || []; });
      (data || []).forEach((v) => {
        (videosByChannel[v.channel_id] = videosByChannel[v.channel_id] || []).push(v);
      });
    }
  }

  // 채널 유형: 최근 영상 중 쇼츠 비율로 판정
  function typeOf(ch) {
    const vids = videosByChannel[ch.id] || [];
    if (vids.length === 0) return "";
    const ratio = vids.filter((v) => v.is_short).length / vids.length;
    if (ratio >= 0.8) return "숏폼";
    if (ratio <= 0.2) return "롱폼";
    return "혼합";
  }

  async function loadChannels() {
    const box = $id("list");
    box.innerHTML = '<p class="empty">데이터를 불러오는 중...</p>';
    if (allChannels.length === 0) await fetchChannels();
    if (allChannels.length === 0) {
      box.innerHTML = '<p class="empty">아직 수집된 채널이 없습니다.</p>';
      return;
    }

    // 0) 관리자가 '승인'한 채널만 수강생에게 노출
    let list = allChannels.filter((c) => c.admin_status === "승인");
    if (list.length === 0) {
      box.innerHTML = '<p class="empty">아직 표시할 채널이 없습니다.<br>매일 새벽 AI가 급상승 채널을 모아오고, 관리자가 승인하면 여기에 순위로 표시됩니다.</p>';
      $id("update-info").textContent = "";
      return;
    }
    // 1) 구독자 필터
    if (filters.subs) {
      const [lo, hi] = filters.subs.split("-").map(Number);
      list = list.filter((c) => c.subscriber_count >= lo && c.subscriber_count < hi);
    }
    // 1-1) 카테고리 필터 (분류 전 채널은 '기타'로 취급)
    if (filters.category) {
      list = list.filter((c) => (c.category || "기타") === filters.category);
    }
    // 2) 정렬 (급상승 데이터 없으면 구독자순으로 대체)
    const hasDaily = list.some((c) => c.daily_views != null && c.daily_views > 0);
    const key = (!hasDaily && filters.sort !== "subscriber_count") ? "subscriber_count" : filters.sort;
    list.sort((a, b) => Number(b[key] || 0) - Number(a[key] || 0));

    // 3) 유형 필터 (유형 판정에는 영상 데이터가 필요 → 전체 영상 로드 후 판정)
    if (filters.type) {
      await fetchVideosFor(list.map((c) => c.id));
      list = list.filter((c) => typeOf(c) === filters.type);
    }

    // 4) 페이지 나누기: 50개씩 (승인 채널 수만큼 페이지 자동 생성)
    const totalCount = list.length;
    const totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    if (page < 1) page = 1;
    const pageRows = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    await fetchVideosFor(pageRows.map((c) => c.id));
    const rows = pageRows.map((c) => ({ ...c, type: typeOf(c) }));

    $id("update-info").textContent = (hasDaily
      ? "기준일: " + (rows[0] && rows[0].stats_date || "") + " · 등급/수익은 인비랩 자체 추정치입니다"
      : "지금은 구독자순입니다. 데이터가 이틀 이상 쌓이면 급상승순으로 자동 전환됩니다 · 등급/수익은 자체 추정치")
      + ` · 승인 채널 ${fmtNum(totalCount)}개 · ${page}/${totalPages}페이지`;

    if (rows.length === 0) {
      box.innerHTML = '<p class="empty">조건에 맞는 채널이 없습니다. 필터를 바꿔보세요.</p>';
      return;
    }
    const listHead = `
      <div class="list-head">
        <div class="h-rank">순위</div>
        <div class="h-ch">채널</div>
        <div class="h-stats">일일 조회수<br>(예상수익)</div>
        <div class="h-vids">🔥 인기 영상 (30일)</div>
      </div>`;
    box.innerHTML = listHead + rows.map((c, i) => {
      const g = gradeOf(c.daily_views);
      const vids = (videosByChannel[c.id] || []).slice(0, 5);
      const money = c.daily_views != null && c.daily_views > 0
        ? fmtWon(c.daily_views * (RATE[c.type] ?? 0.8)) : null;
      return `
      <div class="ch-row">
        <div class="rank-no">${(page - 1) * PAGE_SIZE + i + 1}</div>
        <div class="ch-info">
          <img src="${escapeHtml(c.thumbnail)}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <div class="ch-name" onclick="location.href='channel.html?id=${c.id}'">
              ${g ? `<span class="grade ${g}">${g}</span>` : ""}${escapeHtml(c.title)}${c.type ? `<span class="tag">${c.type}</span>` : ""}${c.ai_genre ? `<span class="genre-tag">${escapeHtml(c.ai_genre)}</span>` : ""}
            </div>
            <div class="ch-meta">구독자 ${fmtNum(c.subscriber_count)}명${c.daily_subs > 0 ? " · +" + fmtNum(c.daily_subs) : ""}</div>
          </div>
        </div>
        <div class="ch-stats">
          ${c.daily_views != null && c.daily_views > 0
            ? `<div class="views">+${fmtNum(c.daily_views)}</div><div class="lbl">일일 조회수 증가</div>`
            : `<div class="views">${fmtNum(c.subscriber_count)}</div><div class="lbl">구독자</div>`}
          ${money ? `<div class="money">${money}</div><div class="lbl">예상수익</div>` : ""}
        </div>
        <div class="ch-videos">
          ${centerRank(vids).map((v) => `
            <a class="${v.rank === 1 ? "center" : ""}" href="https://www.youtube.com/${v.is_short ? "shorts/" : "watch?v="}${v.video_id}" target="_blank" title="${escapeHtml(v.title)}">
              <span class="vrank ${v.rank === 1 ? "top" : ""}">${v.rank}</span>
              <img src="${vthumbSrc(v)}" alt="" loading="lazy" onerror="vthumbFallback(this,'${v.video_id}')">
              <span class="v">${fmtNum(v.view_count)}</span>
            </a>`).join("")}
        </div>
        ${window.__admin ? `
        <div class="admin-ctrl">
          <select class="cat-sel" onchange="adminSetCategory('${c.id}', this.value, this)">
            <option value="" ${!c.category ? "selected" : ""}>카테고리 선택</option>
            ${CATEGORIES.map((k) => `<option value="${k}" ${c.category === k ? "selected" : ""}>${k}</option>`).join("")}
          </select>
          ${c.category_locked ? `<span class="lock-mark">🔒 관리자 지정</span>` : ""}
          <button onclick="adminRevert('${c.id}')">↩ 채널 승인으로 되돌리기</button>
          <button class="del" onclick="adminDelete('${c.id}')">🗑 삭제</button>
        </div>` : ""}
      </div>`;
    }).join("") + renderPager(totalPages, totalCount);
  }

  // ---------- 페이지 이동 버튼 ----------
  function renderPager(totalPages, totalCount) {
    if (totalPages <= 1) return "";
    let btns = "";
    for (let p = 1; p <= totalPages; p++) {
      btns += `<button class="${p === page ? "on" : ""}" onclick="goPage(${p})">${p}</button>`;
    }
    return `<div class="pager">
      <button onclick="goPage(${page - 1})" ${page === 1 ? "disabled" : ""}>‹</button>
      ${btns}
      <button onclick="goPage(${page + 1})" ${page === totalPages ? "disabled" : ""}>›</button>
      <span class="pinfo">총 ${fmtNum(totalCount)}개</span>
    </div>`;
  }
  window.goPage = async function (p) {
    page = p;
    await loadChannels();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // ---------- 관리자 전용: 카테고리 직접 지정 (지정하면 AI가 못 바꾸게 잠금, RLS로 서버에서도 관리자만 허용) ----------
  const CATEGORIES = [
    "영화·드라마 요약", "연예 이슈", "유머·밈·바이럴", "지식·역사·교양", "스포츠",
    "정치·시사", "국뽕·해외반응", "방송·예능", "게임", "동물·펫",
    "음악", "썰·사연·애니툰", "푸드", "랭킹·순위 정보", "기타",
  ];
  async function adminSetCategory(id, cat, el) {
    if (!cat) return;
    const { error } = await sb.from("channels")
      .update({ category: cat, category_locked: true })
      .eq("id", id);
    if (error) { alert("변경 실패: " + error.message); return; }
    const ch = allChannels.find((c) => c.id === id);
    if (ch) { ch.category = cat; ch.category_locked = true; }
    await loadChannels();
  }
  window.adminSetCategory = adminSetCategory;

  // ---------- 관리자 전용: 승인 취소 / 삭제 (RLS로 서버에서도 관리자만 허용) ----------
  async function adminRevert(id) {
    const ch = allChannels.find((c) => c.id === id);
    if (!confirm(`'${ch ? ch.title : "이 채널"}'을(를) 수강생 화면에서 내리고 '채널 승인' 검토 대기로 되돌릴까요?`)) return;
    const { error } = await sb.from("channels").update({ admin_status: "대기" }).eq("id", id);
    if (error) { alert("변경 실패: " + error.message); return; }
    if (ch) ch.admin_status = "대기";
    await loadChannels();
  }
  window.adminRevert = adminRevert;

  async function adminDelete(id) {
    const ch = allChannels.find((c) => c.id === id);
    if (!confirm(`'${ch ? ch.title : "이 채널"}' 채널을 완전히 삭제할까요?\n\n삭제하면 수강생 화면과 채널 승인 목록에서 모두 사라집니다.`)) return;
    const { error } = await sb.from("channels").delete().eq("id", id);
    if (error) { alert("삭제 실패: " + error.message); return; }
    allChannels = allChannels.filter((c) => c.id !== id);
    await loadChannels();
  }
  window.adminDelete = adminDelete;

  // ---------- 인기 영상(롱폼) / 인기 쇼츠 ----------
  function renderVideos(list, urlFn, metricFn) {
    return list.map((v, i) => `
      <div class="rank-item" style="cursor:pointer" onclick="window.open('${urlFn(v)}','_blank')">
        <div class="rank-no">${i + 1}</div>
        <img class="rank-thumb video" src="${escapeHtml(v.thumbnail)}" alt="" onerror="this.style.visibility='hidden'">
        <div class="rank-main">
          <div class="name">${escapeHtml(v.title)}</div>
          <div class="sub">${escapeHtml(v.channel_title || (v.channels && v.channels.title) || "")}</div>
        </div>
        <div class="rank-right">${metricFn(v)}</div>
      </div>`).join("");
  }

  async function loadVideos() {
    const box = $id("list");
    const { data: latest } = await sb.from("trending_videos")
      .select("date").order("date", { ascending: false }).limit(1);
    if (!latest || latest.length === 0) {
      box.innerHTML = '<p class="empty">아직 수집된 영상이 없습니다.</p>';
      return;
    }
    const day = latest[0].date;
    const { data } = await sb.from("trending_videos")
      .select("video_id,title,channel_title,thumbnail,view_count")
      .eq("date", day).eq("is_short", false)
      .order("rank", { ascending: true }).limit(60);
    if (!data || data.length === 0) {
      box.innerHTML = '<p class="empty">표시할 영상이 없습니다.</p>';
      return;
    }
    $id("update-info").textContent = "기준일: " + day + " · 유튜브 대한민국 인기 순위";
    box.innerHTML = renderVideos(data,
      (v) => "https://www.youtube.com/watch?v=" + v.video_id,
      (v) => `<b>${fmtNum(v.view_count)}</b><span class="lbl">조회수</span>`);
  }

  async function loadShorts() {
    const box = $id("list");
    let { data } = await sb.from("channel_videos")
      .select("video_id,title,thumbnail,view_count,daily_views,channels(title)")
      .eq("is_short", true).not("daily_views", "is", null).gt("daily_views", 0)
      .order("daily_views", { ascending: false }).limit(50);
    let daily = true;
    if (!data || data.length === 0) {
      const r = await sb.from("channel_videos")
        .select("video_id,title,thumbnail,view_count,daily_views,channels(title)")
        .eq("is_short", true)
        .order("view_count", { ascending: false }).limit(50);
      data = r.data; daily = false;
    }
    if (!data || data.length === 0) {
      box.innerHTML = '<p class="empty">쇼츠 데이터를 수집하는 중입니다.</p>';
      return;
    }
    $id("update-info").textContent = daily
      ? "인비랩 추적 채널의 쇼츠 · 어제 대비 조회수 증가 순"
      : "인비랩 추적 채널의 쇼츠 · 총 조회수순 (데이터가 쌓이면 급상승순으로 자동 전환)";
    box.innerHTML = renderVideos(data,
      (v) => "https://www.youtube.com/shorts/" + v.video_id,
      (v) => daily
        ? `<b>+${fmtNum(v.daily_views)}</b><span class="lbl">일일 조회수 증가</span>`
        : `<b>${fmtNum(v.view_count)}</b><span class="lbl">조회수</span>`);
  }

  // ---------- 초기화 ----------
  (async function () {
    await renderHeader("today");
    renderFooter();
    const user = await requireLogin();
    if (!sb) { $id("list").innerHTML = '<p class="empty">서버 연결 후 표시됩니다.</p>'; return; }
    window.__admin = user ? await isAdmin(user) : false;   // 관리자면 채널 되돌리기/삭제 버튼 표시
    await loadChannels();

    // 탭 전환
    document.querySelectorAll("#tabs .tab").forEach((btn) => {
      btn.addEventListener("click", async function () {
        document.querySelectorAll("#tabs .tab").forEach((b) => b.classList.remove("on"));
        this.classList.add("on");
        const t = this.dataset.tab;
        const showCh = (t === "channels");
        $id("filter-bar").style.display = showCh ? "block" : "none";
        $id("list").innerHTML = '<p class="empty">불러오는 중...</p>';
        if (t === "channels") await loadChannels();
        else if (t === "videos") await loadVideos();
        else await loadShorts();
      });
    });

    // 필터 버튼
    document.querySelectorAll(".fbtn").forEach((btn) => {
      btn.addEventListener("click", async function () {
        const f = this.dataset.f;
        document.querySelectorAll(`.fbtn[data-f="${f}"]`).forEach((b) => b.classList.remove("on"));
        this.classList.add("on");
        filters[f] = this.dataset.v;
        page = 1; // 필터를 바꾸면 1페이지부터
        await loadChannels();
      });
    });
  })();
</script>
</body>
</html>
