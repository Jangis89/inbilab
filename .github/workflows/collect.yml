# ============================================
# 인비랩 수집 로봇 자동 실행 설정
# 이 파일은 GitHub에서 다음 경로에 만들어야 합니다:
#   .github/workflows/collect.yml
# (안내서의 순서를 따라 만들어 주세요)
# ============================================
name: 인비랩 데이터 수집

on:
  schedule:
    - cron: "23 18 * * *"  # 매일 UTC 18:23 = 한국시간 새벽 3시 23분
    - cron: "23 8 * * *"   # 매일 UTC 08:23 = 한국시간 오후 5시 23분 (카테고리 정밀 재검수 포함)
  workflow_dispatch: {}      # "Run workflow" 버튼으로 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 수집 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node collector/collect.mjs
      - name: kakao notify
        if: always()
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          JOB_STATUS: ${{ job.status }}
        run: node collector/notify.mjs

      - name: 생존 신고 (healthchecks.io)
        if: success()
        continue-on-error: true   # 생존 신고가 실패해도 수집 자체는 성공으로 표시
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null
          else
            echo "HEALTHCHECK_URL 미설정 - 생존 신고 건너뜀"
          fi
