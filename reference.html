<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레퍼런스 영상 — 인비랩</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .ref-card{display:flex;gap:16px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;background:#fff;align-items:flex-start;}
  .ref-thumb{display:block;position:relative;width:132px;height:234px;border-radius:10px;overflow:hidden;background:#000;flex-shrink:0;box-shadow:0 1px 4px rgba(15,23,42,.15);}
  .ref-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ref-thumb .vt{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:12px;font-weight:800;text-align:center;padding:14px 2px 5px;}
  .ref-body{flex:1;min-width:0;}
  .ref-title{font-size:16.5px;font-weight:800;line-height:1.35;margin-bottom:4px;}
  .ref-src{font-size:12.5px;color:var(--sub);margin-bottom:8px;}
  .ref-src b{color:var(--ink);}
  .src-tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:#f1f5f9;color:#475569;margin-left:6px;vertical-align:middle;}
  .ai-box{background:#faf5ff;border:1px solid #e9d5ff;border-radius:10px;padding:10px 13px;font-size:13.5px;line-height:1.6;}
  .ai-box .ai-head{font-size:12px;font-weight:800;color:#7c3aed;margin-bottom:5px;}
  .ai-box .row{margin-bottom:3px;}
  .ai-box .lbl{font-weight:800;color:#6d28d9;}
  .ai-box .cau{color:#b45309;}
  .idea-chip{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:#eff6ff;color:var(--blue-dark);margin:3px 4px 0 0;}
  .fit-badge{display:inline-block;font-size:12px;font-weight:900;padding:2px 9px;border-radius:999px;background:#dcfce7;color:#166534;margin-left:6px;vertical-align:middle;}
  .genre-tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#f0fdf4;color:#166534;margin-left:5px;vertical-align:middle;}
  .admin-ctrl{margin-top:8px;text-align:right;}
  .admin-ctrl button{padding:5px 11px;border-radius:999px;border:2px solid #fecaca;background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:#991b1b;font-family:inherit;}
  .empty{padding:44px 0;text-align:center;color:var(--sub);font-size:17px;}
  @media(max-width:700px){.ref-card{flex-direction:column;}.ref-thumb{width:110px;height:195px;}}
</style>
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div class="wrap">
    <h1 class="page-title">레퍼런스 영상 🎬</h1>
    <p class="page-desc">관리자가 승인한 무출연 쇼츠 채널의 인기 영상을 AI가 하나씩 분석했습니다. 훅·구성·소재 아이디어를 참고해 나만의 영상으로 재구성하세요.</p>
    <p style="font-size:13.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 14px;margin:-6px 0 18px;line-height:1.55;">
      ⚠️ 이 영상들은 <b>그대로 복제하기 위한 자료가 아닙니다.</b> 성과가 난 훅·스토리·편집 구조를 분석하고, 합법적으로 쓸 수 있는 새로운 소재와 독창적인 내용으로 재구성하세요.
    </p>
    <div id="list"><p class="empty">불러오는 중...</p></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  function fmtNum(n) {
    n = Number(n || 0);
    if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "억";
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "만";
    return n.toLocaleString();
  }
  function daysAgo(d) {
    if (!d) return "";
    const diff = Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
    return diff <= 0 ? "오늘" : `${diff}일 전`;
  }
  function vthumbSrc(id) { return `https://i.ytimg.com/vi/${id}/oardefault.jpg`; }
  window.vthumbFallback = function (img, id) {
    if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"; }
    else { img.style.visibility = "hidden"; }
  };

  let adminMode = false;

  async function load() {
    const box = document.getElementById("list");
    // 1) 관리자가 '승인'한 채널 (튜브랩 + 인비남 AI 모두)
    const { data: chs } = await sb.from("channels")
      .select("id,title,ai_genre")
      .eq("admin_status", "승인")
      .lt("subscriber_count", 500000)
      .limit(600);
    const chMap = new Map((chs || []).map((c) => [c.id, c]));
    if (chMap.size === 0) {
      box.innerHTML = '<p class="empty">아직 표시할 레퍼런스가 없습니다.<br>관리자가 채널을 승인하고 AI 영상 분석이 쌓이면 여기에 표시됩니다.</p>';
      return;
    }
    // 2) 그 채널들의 쇼츠 중 AI 분석이 끝난 영상 (채널별 개별 조회로 잘림 방지)
    const ids = [...chMap.keys()];
    const all = [];
    for (let i = 0; i < ids.length; i += 12) {
      const part = ids.slice(i, i + 12);
      await Promise.all(part.map(async (id) => {
        const { data } = await sb.from("channel_videos")
          .select("video_id,channel_id,title,view_count,daily_views,published_at,ai_fit,ai_hook,ai_structure,ai_benchmark,ai_caution,ai_ideas,admin_status")
          .eq("channel_id", id)
          .eq("is_short", true)
          .gte("ai_fit", 70)
          .not("analyzed_at", "is", null)
          .order("view_count", { ascending: false })
          .limit(6);
        all.push(...(data || []));
      }));
    }
    let list = all.filter((v) => v.admin_status !== "제외");
    list.sort((a, b) => (Number(b.daily_views) || 0) - (Number(a.daily_views) || 0) || Number(b.view_count) - Number(a.view_count));
    list = list.slice(0, 60);
    if (list.length === 0) {
      box.innerHTML = '<p class="empty">아직 분석이 끝난 레퍼런스 영상이 없습니다.<br>매일 새벽 AI가 승인 채널의 인기 쇼츠를 분석해 추가합니다.</p>';
      return;
    }
    box.innerHTML = list.map((v) => {
      const ch = chMap.get(v.channel_id) || {};
      const ideas = Array.isArray(v.ai_ideas) ? v.ai_ideas : [];
      return `
      <div class="ref-card" data-vid="${v.video_id}">
        <a class="ref-thumb" href="https://www.youtube.com/shorts/${v.video_id}" target="_blank" rel="noopener">
          <img src="${vthumbSrc(v.video_id)}" alt="" loading="lazy" onerror="vthumbFallback(this,'${v.video_id}')">
          <span class="vt">${fmtNum(v.view_count)}회</span>
        </a>
        <div class="ref-body">
          <div class="ref-title">${escapeHtml(v.title)}${v.ai_fit ? `<span class="fit-badge">적합도 ${v.ai_fit}</span>` : ""}</div>
          <div class="ref-src"><b>${escapeHtml(ch.title || "")}</b>${ch.ai_genre ? `<span class="genre-tag">${escapeHtml(ch.ai_genre)}</span>` : ""}
            · 조회수 ${fmtNum(v.view_count)}회${v.daily_views ? ` (하루 +${fmtNum(v.daily_views)})` : ""} · ${daysAgo(v.published_at)}<span class="src-tag">출처: YouTube</span></div>
          <div class="ai-box">
            <div class="ai-head">🤖 인비랩 AI 분석</div>
            ${v.ai_hook ? `<div class="row"><span class="lbl">훅:</span> ${escapeHtml(v.ai_hook)}</div>` : ""}
            ${v.ai_structure ? `<div class="row"><span class="lbl">구성:</span> ${escapeHtml(v.ai_structure)}</div>` : ""}
            ${v.ai_benchmark ? `<div class="row"><span class="lbl">배울 점:</span> ${escapeHtml(v.ai_benchmark)}</div>` : ""}
            ${v.ai_caution ? `<div class="row cau"><span class="lbl" style="color:#b45309;">⚠ 주의:</span> ${escapeHtml(v.ai_caution)}</div>` : ""}
            ${ideas.length ? `<div class="row"><span class="lbl">새 소재 아이디어:</span><br>${ideas.map((i) => `<span class="idea-chip">${escapeHtml(String(i))}</span>`).join("")}</div>` : ""}
          </div>
          ${adminMode ? `<div class="admin-ctrl"><button onclick="hideVideo('${v.video_id}')">✗ 수강생 노출 제외</button></div>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  window.hideVideo = async function (vid) {
    if (!confirm("이 영상을 수강생 화면에서 제외할까요?")) return;
    const { error } = await sb.from("channel_videos").update({ admin_status: "제외" }).eq("video_id", vid);
    if (error) { alert("제외 실패: " + error.message); return; }
    const el = document.querySelector(`.ref-card[data-vid="${vid}"]`);
    if (el) el.remove();
  };

  (async function init() {
    await renderHeader("reference");
    renderFooter();
    const user = await requireLogin();
    if (!user) return;
    adminMode = await isAdmin(user);
    await load();
  })();
</script>
</body>
</html>
