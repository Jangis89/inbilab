<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<title>영상 무음 제거 — 인비랩</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .devnote{background:#fefce8;border:1px solid #fde047;border-radius:10px;padding:9px 14px;font-size:13px;color:#854d0e;margin-bottom:16px;}
  .drop{border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;background:var(--bg-soft);cursor:pointer;margin-bottom:14px;}
  .drop:hover{border-color:var(--blue);} .drop b{color:var(--blue);} .drop .sub{font-size:13.5px;color:var(--sub);margin-top:6px;}
  .vs-file{font-size:14.5px;color:var(--ink);margin:10px 0;word-break:break-all;}
  .go-btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:16.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .go-btn:disabled{opacity:.5;cursor:not-allowed;}
  .prog-wrap{display:none;margin:16px 0;} .prog-wrap.show{display:block;}
  .prog-bar{height:14px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .prog-fill{height:100%;width:0%;background:var(--blue);transition:width .3s;}
  .prog-txt{font-size:14px;color:var(--sub);margin-top:8px;text-align:center;}
  .result{display:none;background:#f0fdf4;border:2px solid #bbf7d0;border-radius:14px;padding:18px;margin-top:16px;} .result.show{display:block;}
  .result h3{font-size:17px;margin-bottom:10px;}
  .result video{width:100%;border-radius:10px;margin:10px 0;background:#000;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
  .stat-c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .stat-c b{display:block;font-size:19px;color:var(--blue);} .stat-c.green b{color:#16a34a;} .stat-c span{font-size:12.5px;color:var(--sub);}
  .dl-btn{display:inline-block;padding:13px 24px;border-radius:12px;background:#16a34a;color:#fff;font-size:15.5px;font-weight:800;text-decoration:none;cursor:pointer;}
  .vs-err{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:12px 15px;margin:12px 0;font-size:14px;} .vs-err.show{display:block;}
  @media(max-width:860px){ .stat-row{grid-template-columns:1fr;} }
  .wl-item{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff;}
  .wl-title{font-weight:700;font-size:14.5px;margin-bottom:8px;word-break:keep-all;}
  .wl-video{width:100%;border-radius:10px;background:#000;margin:6px 0;}
  .wl-note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;}
  .wl-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .recut-box{font-size:13px;color:var(--sub);}
  .wl-sens{padding:4px 6px;border-radius:6px;}
  .recut-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;font-weight:600;}
  @media(max-width:860px){ .wl-act{flex-direction:column;align-items:stretch;} }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="page">
  <div class="wrap" style="max-width:820px;">
    <h1 class="page-title">영상 무음 제거 🎞️</h1>
    <div class="devnote" id="devnote" style="display:none;">🔒 이 기능은 아직 <b>비공개(관리자 전용)</b>입니다. 공개하려면 작업실에서 스위치를 켜세요.</div>
    <p class="an-hint" style="font-size:14.5px;margin-bottom:14px;">동영상을 넣으면 <b>말 사이의 조용한 빈 구간을 찾아, 그 부분의 화면과 소리를 함께 잘라내</b> 빠릿한 영상으로 만들어 드립니다. 처리는 우리 전용 서버가 하며, 완성되면 다운로드 링크가 나옵니다. (지금은 3시간 이하 영상 지원)</p>
    <div style="margin:0 0 12px;font-size:14px;line-height:1.9;">
      <span style="color:var(--sub);margin-right:6px;">무음을 얼마나 과감하게 자를까요?</span><br>
      <label style="margin-right:12px;"><input type="radio" name="sens" value="0.1"> 매우 과감(0.1초)</label>
      <label style="margin-right:12px;"><input type="radio" name="sens" value="0.15" checked> 과감(0.15초·추천)</label>
      <label style="margin-right:12px;"><input type="radio" name="sens" value="0.25"> 보통(0.25초)</label>
      <label><input type="radio" name="sens" value="0.4"> 자연스럽게(0.4초)</label>
    </div>
    <div class="drop" id="drop" onclick="pick()">
      🎬 <b>여기를 눌러 동영상 선택</b> (또는 끌어다 놓기)
      <div class="sub">MP4·MOV 등 · 3시간 이하 · 소리가 있는 영상</div>
    </div>
    <input id="file-in" type="file" accept="video/*,.mp4,.mov,.m4v,.webm" multiple style="display:none">
    <div class="vs-err" id="vs-err"></div>
    <div class="prog-wrap" id="up-wrap"><div class="prog-bar"><div class="prog-fill" id="up-fill"></div></div><div class="prog-txt" id="up-txt"></div></div>
    <div id="adm-panel" style="display:none;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:9px 14px;font-size:13.5px;color:#3730a3;margin:10px 0;">📊 <span id="adm-stats">불러오는 중…</span></div>
    <div id="worklist"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>

  var pollTimer=null, rows={};
  function pick(){ document.getElementById("file-in").click(); }
  function fmt(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return m>0?(m+"분 "+s+"초"):(s+"초"); }
  function fmtSize(b){ return (b/1048576).toFixed(1)+"MB"; }
  function showErr(m){ var e=$id("vs-err"); e.textContent=m; e.className="vs-err show"; }
  function hideErr(){ $id("vs-err").className="vs-err"; }
  function setUp(p,t){ var w=$id("up-wrap"); if(p<0){ w.className="prog-wrap"; return; } w.className="prog-wrap show"; $id("up-fill").style.width=p+"%"; $id("up-txt").textContent=t; }
  function curMin(){ var s=document.querySelector('input[name=sens]:checked'); return s?parseFloat(s.value):0.15; }
  var SENS_OPTS='<option value="0.1">매우 과감(0.1초)</option><option value="0.15">과감(0.15초)</option><option value="0.25">보통(0.25초)</option><option value="0.4">자연스럽게(0.4초)</option>';
  $id("file-in").addEventListener("change", function(ev){ if(ev.target.files&&ev.target.files.length) choose(ev.target.files); ev.target.value=""; });
  var dz=$id("drop"); dz.addEventListener("dragover",function(e){e.preventDefault();}); dz.addEventListener("drop",function(e){e.preventDefault(); if(e.dataTransfer.files&&e.dataTransfer.files.length) choose(e.dataTransfer.files);});
  async function choose(fileList){
    hideErr(); var files=Array.prototype.slice.call(fileList);
    try{ var _b=await sb.rpc("desilence_busy"); if(!_b.error && (_b.data||0)>=3){ showErr("지금은 다른 분들의 영상을 처리하는 중이에요. 1~2분 뒤에 다시 시도해 주세요. 🙏"); return; } }catch(e){}
    var user=await getUser(); if(!user){ location.replace("login.html?next=video-silence.html"); return; }
    var min=curMin();
    for(var i=0;i<files.length;i++){ await uploadOne(files[i], user, min, i+1, files.length); }
    setUp(-1,""); ensurePoll();
  }
  function uploadOne(file, user, min, idx, total){
    return new Promise(function(resolve){
      if(file.size>8*1024*1024*1024){ showErr("영상 "+file.name+"이 너무 큽니다 (8GB 이하)."); resolve(); return; }
      var ext=(file.name.split(".").pop()||"mp4").toLowerCase();
      sb.auth.getSession().then(function(sres){
        var token=sres.data.session.access_token;
        var objectName=user.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
        var upload=new tus.Upload(file, {
          endpoint: cfg.SUPABASE_URL+"/storage/v1/upload/resumable",
          retryDelays:[0,3000,8000,15000,30000],
          headers:{ authorization:"Bearer "+token, "x-upsert":"false" },
          uploadDataDuringCreation:true, removeFingerprintOnSuccess:true, chunkSize:6*1024*1024,
          metadata:{ bucketName:"videos-source", objectName:objectName, contentType:file.type||"video/mp4", cacheControl:"3600" },
          onError:function(err){ showErr("업로드에 문제가 생겼어요. 잠시 후 다시 시도해 주세요."); console.error(err); resolve(); },
          onProgress:function(sent,tot){ var pct=Math.floor(sent/tot*100); setUp(pct, "["+idx+"/"+total+"] "+file.name+" 올리는 중… "+pct+"%"); },
          onSuccess:async function(){
            setUp(99, "["+idx+"/"+total+"] 등록 중…");
            var ins=await sb.from("sc_projects").insert({ user_id:user.id, title:file.name, source_path:objectName, source_bytes:file.size, objective:"desilence", desilence_min:min, rights_agreed_at:new Date().toISOString() }).select("id,title,status").single();
            if(ins.error){ showErr("등록 오류: "+ins.error.message); resolve(); return; }
            makeRow(ins.data.id, ins.data.title); resolve();
          }
        });
        upload.start();
      });
    });
  }
  function ensurePoll(){ if(!pollTimer) pollTimer=setInterval(pollAll, 3000); pollAll(); }
  function makeRow(id, title){
    if(rows[id]) return rows[id];
    var w=document.createElement("div"); w.className="wl-item";
    w.innerHTML='<div class="wl-title"></div><div class="wl-prog"><div class="prog-bar"><div class="prog-fill wl-fill"></div></div><div class="prog-txt wl-txt">대기 중…</div></div><div class="wl-done" style="display:none;"><h4 style="margin:0 0 8px;">✅ 완성! 미리 보고 받으세요</h4><video class="wl-video" controls preload="metadata"></video><div class="stat-row"><div class="stat-c"><b class="s-o">-</b><span>원래</span></div><div class="stat-c"><b class="s-n">-</b><span>처리 후</span></div><div class="stat-c green"><b class="s-c">-</b><span>줄인 시간</span></div></div><div class="wl-note">⏳ 이 영상은 <b>24시간 뒤 자동 삭제</b>돼요. 미리 받아두세요.</div><div class="wl-act"><a class="dl-btn wl-dl" download>⬇️ 다운로드</a> <span class="recut-box">다시 자를까요? <select class="wl-sens">'+SENS_OPTS+'</select> <button class="recut-btn">✂️ 다시 자르기</button></span></div></div>';
    w.querySelector(".wl-title").textContent=title;
    w.querySelector(".recut-btn").addEventListener("click", function(){ var m=parseFloat(w.querySelector(".wl-sens").value)||0.15; doRecut(id,m,w); });
    var wl=$id("worklist"); wl.insertBefore(w, wl.firstChild); rows[id]=w; return w;
  }
  async function doRecut(id,m,w){
    w.querySelector(".wl-done").style.display="none"; w.querySelector(".wl-prog").style.display="block"; w.querySelector(".wl-txt").textContent="다시 자르는 중…";
    var r=await sb.rpc("recut_desilence", { p_project:id, p_min:m });
    if(r.error){ showErr("다시 자르기 실패: "+r.error.message); return; }
    ensurePoll();
  }
  function updateRow(w,p){
    var st=p.status||"", detail=p.status_detail||"";
    if(st==="desilence_done"){
      var info={}; try{ info=JSON.parse(detail); }catch(e){}
      w.querySelector(".wl-prog").style.display="none"; w.querySelector(".wl-done").style.display="block";
      w.querySelector(".s-o").textContent=fmt(info.orig_sec||0); w.querySelector(".s-n").textContent=fmt(info.new_sec||0); w.querySelector(".s-c").textContent="-"+fmt(info.cut_sec||0);
      if(info.result_url){ var v=w.querySelector(".wl-video"); if(v.getAttribute("src")!==info.result_url){ v.setAttribute("src",info.result_url); } var a=w.querySelector(".wl-dl"); a.href=info.result_url; a.download=(w.querySelector(".wl-title").textContent||"영상").replace(/\.[^.]+$/,"")+"_무음제거.mp4"; }
    } else if(st.indexOf("failed")===0){
      w.querySelector(".wl-done").style.display="none"; w.querySelector(".wl-prog").style.display="block"; w.querySelector(".wl-txt").textContent="처리 실패: "+(detail||"알 수 없는 오류");
    } else {
      w.querySelector(".wl-done").style.display="none"; w.querySelector(".wl-prog").style.display="block";
      var map={ uploaded:"서버가 영상을 확인하는 중…", probing:"서버가 영상을 확인하는 중…", desilence_running:(detail||"무음을 잘라내는 중…") };
      var pct=st==="desilence_running"?70:((st==="probing"||st==="uploaded")?40:20);
      w.querySelector(".wl-fill").style.width=pct+"%"; w.querySelector(".wl-txt").textContent=map[st]||detail||"처리 중…";
    }
  }
  async function pollAll(){
    var user=await getUser(); if(!user) return;
    var r=await sb.from("sc_projects").select("id,title,status,status_detail").eq("user_id",user.id).eq("objective","desilence").order("created_at",{ascending:false}).limit(12);
    if(r.error||!r.data) return;
    var active=false;
    r.data.forEach(function(p){ var w=rows[p.id]||makeRow(p.id,p.title); updateRow(w,p); if(p.status!=="desilence_done" && (p.status||"").indexOf("failed")!==0) active=true; });
    if(!active && pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  }
  async function loadStats(){
    try{ var s=await sb.rpc("admin_desilence_stats"); if(s.error||!s.data) return; var d=s.data; var cost=(d.month_done*0.04);
      $id("adm-stats").innerHTML="오늘 처리 <b>"+d.today_done+"</b>건 · 처리 중 <b>"+d.active+"</b>건 · 이번 달 <b>"+d.month_done+"</b>건 · 예상 비용 약 <b>$"+cost.toFixed(1)+"</b> (대략)";
    }catch(e){}
  }
  (async () => {
    const { data } = await sb.auth.getSession();
    const user = data && data.session ? data.session.user : null;
    if (!user) { location.replace("login.html?next=video-silence.html"); return; }
    const adm = await isAdmin(user);
    if (!adm) { const { data: fl } = await sb.from("feature_flags").select("is_public").eq("key","video_desilence").maybeSingle(); if (!fl || !fl.is_public) { location.replace("dashboard.html"); return; } }
    else { const { data: fl2 } = await sb.from("feature_flags").select("is_public").eq("key","video_desilence").maybeSingle(); if (!fl2 || !fl2.is_public) $id("devnote").style.display="block"; if($id("adm-panel")){ $id("adm-panel").style.display="block"; loadStats(); } }
    await renderHeader("video-silence"); renderFooter();
    ensurePoll();
  })();

</script>
</body>
</html>
