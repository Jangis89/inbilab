# ============================================
# 인비랩 수집 로봇 자동 실행 설정
# 이 파일은 GitHub에서 다음 경로에 만들어야 합니다:
#   .github/workflows/collect.yml
# (안내서의 순서를 따라 만들어 주세요)
# ============================================
name: 인비랩 데이터 수집

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 UTC 18:00 = 한국시간 새벽 3시
  workflow_dispatch: {}      # "Run workflow" 버튼으로 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 수집 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node collector/collect.mjs
