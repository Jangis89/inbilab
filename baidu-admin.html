<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<title>바이두 관리자 제어판 · 인비랩</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;background:#f5f6f8;color:#1a1a1a;}
  #wrap{max-width:920px;margin:0 auto;padding:18px 16px 80px;}
  h1{font-size:20px;margin:6px 0 2px;}
  .sub{color:#888;font-size:13px;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #e6e8eb;border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .card h2{font-size:15px;margin:0 0 12px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .stat{flex:1;min-width:120px;background:#fafbfc;border:1px solid #eef0f2;border-radius:10px;padding:12px;text-align:center;}
  .stat b{display:block;font-size:24px;line-height:1.1;}
  .stat span{font-size:12px;color:#888;}
  .big{font-size:15px;font-weight:700;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .on{background:#e6f4ea;color:#1e7e34;} .off{background:#fdecea;color:#c0392b;} .warn{background:#fff4e5;color:#e67e22;}
  button.btn{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-danger{background:#c0392b;color:#fff;} .btn-ok{background:#1e7e34;color:#fff;}
  .btn-gray{background:#eceff1;color:#333;}
  label{display:block;font-size:12.5px;color:#555;margin:10px 0 4px;}
  input[type=number]{width:150px;padding:9px;border:1px solid #d5d8dc;border-radius:8px;font-size:14px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #eee;}
  th{color:#888;font-weight:600;}
  .muted{color:#999;} .note{font-size:12px;color:#888;margin-top:8px;line-height:1.5;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  a.back{font-size:13px;color:#3b82f6;text-decoration:none;}
</style>
</head>
<body>
<div id="site-header"></div>
<div id="wrap">
  <a class="back" href="admin.html">← 관리자 홈</a>
  <h1>🛡️ 바이두 검색 관리자 제어판</h1>
  <div class="sub">원본찾기(바이두 이미지검색)의 사용량과 안전장치를 여기서 직접 조절합니다. 코드 수정 없이 즉시 반영돼요.</div>
  <div id="content"><p class="muted">불러오는 중…</p></div>
</div>
<div id="site-footer"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},2200); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  var S = {}; // settings key->value

  async function loadAll(){
    // 1) settings
    var st = await sb.from("app_settings").select("key,value");
    S = {};
    (st.data||[]).forEach(function(r){ S[r.key]=r.value; });
    // 2) global today (가장 최근 날짜 = 오늘)
    var g = await sb.from("baidu_daily_usage").select("day,calls").order("day",{ascending:false}).limit(1);
    var day = (g.data && g.data[0]) ? g.data[0].day : null;
    var globalCalls = (g.data && g.data[0]) ? g.data[0].calls : 0;
    // 3) per-user today
    var users = [];
    if(day){
      var u = await sb.from("baidu_user_daily").select("user_id,calls").eq("day",day).order("calls",{ascending:false}).limit(10);
      users = u.data||[];
    }
    // 4) today's logs for outcome breakdown
    var logs = [];
    if(day){
      var startUTC = day + "T00:00:00+00:00";
      var lg = await sb.from("baidu_call_log").select("created_at,user_id,ok,blocked,err_code,reason,same_count,item_count").gte("created_at",startUTC).order("created_at",{ascending:false}).limit(500);
      logs = lg.data||[];
    }
    render(day, globalCalls, users, logs);
  }

  function outcomeOf(l){ if(l.blocked) return "blocked"; if(l.ok) return "ok"; if(String(l.err_code||"")==="QUOTA_USER_DAILY_FREE") return "quota_free"; return "error"; }
  function countBy(logs, key){ return logs.filter(function(l){return outcomeOf(l)===key;}).length; }

  function render(day, globalCalls, users, logs){
    var enabled = String(S.BAIDU_API_ENABLED)==="true";
    var stop = String(S.BAIDU_EMERGENCY_STOP)==="true";
    var gLimit = Number(S.BAIDU_DAILY_GLOBAL_CALL_LIMIT||0);
    var uLimit = Number(S.BAIDU_PER_USER_DAILY_CALL_LIMIT||0);
    var budget = Number(S.BAIDU_MONTHLY_BUDGET_CNY||0);
    var okN = countBy(logs,"ok"), blockN=countBy(logs,"blocked"), quotaN=countBy(logs,"quota_free"), errN=countBy(logs,"error");
    var totalLog = logs.length;
    var failRate = totalLog? Math.round((errN)/totalLog*100) : 0;
    var freeLeft = Math.max(0, 100 - globalCalls); // 무료 100회/일 기준 추정

    var h = "";
    // 상태 카드
    h += '<div class="card"><h2>현재 상태</h2>';
    h += '<div class="row">';
    h += '<div class="stat"><span>바이두 검색</span><b class="big">'+(enabled?'<span class="pill on">켜짐</span>':'<span class="pill off">꺼짐</span>')+'</b></div>';
    h += '<div class="stat"><span>긴급 중단</span><b class="big">'+(stop?'<span class="pill off">작동중(정지)</span>':'<span class="pill on">정상</span>')+'</b></div>';
    h += '<div class="stat"><span>오늘 날짜(UTC)</span><b class="big" style="font-size:15px">'+esc(day||'-')+'</b></div>';
    h += '</div></div>';

    // 오늘 사용량
    h += '<div class="card"><h2>오늘 사용량</h2><div class="row">';
    h += '<div class="stat"><b>'+globalCalls+'</b><span>총 호출수</span></div>';
    h += '<div class="stat"><b style="color:#1e7e34">'+okN+'</b><span>성공</span></div>';
    h += '<div class="stat"><b style="color:#e67e22">'+quotaN+'</b><span>무료소진</span></div>';
    h += '<div class="stat"><b style="color:#8e44ad">'+blockN+'</b><span>한도차단</span></div>';
    h += '<div class="stat"><b style="color:#c0392b">'+errN+'</b><span>오류</span></div>';
    h += '</div>';
    h += '<div class="note">무료 100회/일 기준 남은 횟수(추정): <b>'+freeLeft+'회</b> · 오류율: <b>'+failRate+'%</b> · 로그 기준 표본 '+totalLog+'건</div>';
    h += '</div>';

    // 안전장치 조절
    h += '<div class="card"><h2>안전장치 (버튼으로 즉시 조절)</h2>';
    h += '<div class="row">';
    h += '<button class="btn '+(stop?'btn-ok':'btn-danger')+'" id="btnStop">'+(stop?'✅ 긴급중단 해제 (다시 켜기)':'⛔ 긴급중단 (지금 바이두 멈춤)')+'</button>';
    h += '<button class="btn '+(enabled?'btn-gray':'btn-ok')+'" id="btnEnable">'+(enabled?'바이두 검색 끄기(관리자만 사용)':'바이두 검색 켜기(전체 공개)')+'</button>';
    h += '</div>';
    h += '<div class="note">긴급중단을 누르면 모든 사람(관리자 포함)에게 바이두 호출이 즉시 멈추고 구글 렌즈로 넘어갑니다. 검색 끄기는 수강생만 막고 관리자님은 계속 테스트할 수 있어요.</div>';
    h += '</div>';

    // 한도/예산
    h += '<div class="card"><h2>한도 · 예산</h2>';
    h += '<label>하루 전체 호출 상한 (회)</label><input type="number" id="inGlobal" value="'+gLimit+'" min="0">';
    h += '<label>수강생 1명당 하루 상한 (회) — 관리자님은 제외됨</label><input type="number" id="inUser" value="'+uLimit+'" min="0">';
    h += '<label>월 예산 상한 (위안 CNY)</label><input type="number" id="inBudget" value="'+budget+'" min="0">';
    h += '<div style="margin-top:14px"><button class="btn btn-ok" id="btnSave">💾 저장</button></div>';
    h += '</div>';

    // 수강생별 순위
    h += '<div class="card"><h2>오늘 많이 쓴 순위 (상위 10명)</h2>';
    if(users.length){
      h += '<table><tr><th>#</th><th>수강생 ID(앞 8자리)</th><th>호출수</th></tr>';
      users.forEach(function(u,i){ h += '<tr><td>'+(i+1)+'</td><td>'+esc(String(u.user_id).slice(0,8))+'…</td><td>'+u.calls+'</td></tr>'; });
      h += '</table>';
    } else { h += '<p class="muted">오늘 사용 기록이 아직 없습니다.</p>'; }
    h += '</div>';

    // 최근 로그
    h += '<div class="card"><h2>최근 검색 기록 (최근 25건)</h2>';
    if(logs.length){
      h += '<table><tr><th>시각</th><th>수강생</th><th>결과</th><th>비고</th></tr>';
      logs.slice(0,25).forEach(function(l){
        var t = new Date(l.created_at); var hh = t.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
        var ocKey = outcomeOf(l);
        var oc = {ok:"성공",blocked:"차단",quota_free:"무료소진",error:"오류"}[ocKey]||esc(ocKey);
        var extra = ocKey==="ok" ? ("동일"+(l.same_count||0)+"·결과"+(l.item_count||0)) : esc(l.err_code||l.reason||"");
        h += '<tr><td>'+hh+'</td><td>'+esc(String(l.user_id||"").slice(0,8))+'…</td><td>'+oc+'</td><td class="muted">'+extra+'</td></tr>';
      });
      h += '</table>';
    } else { h += '<p class="muted">오늘 기록이 아직 없습니다.</p>'; }
    h += '</div>';

    $("content").innerHTML = h;

    // 버튼 연결
    $("btnStop").onclick = function(){ setSetting("BAIDU_EMERGENCY_STOP", stop?"false":"true", stop?"긴급중단을 해제했습니다":"긴급중단을 켰습니다 (바이두 정지)"); };
    $("btnEnable").onclick = function(){ setSetting("BAIDU_API_ENABLED", enabled?"false":"true", enabled?"바이두 검색을 껐습니다 (관리자만 사용)":"바이두 검색을 켰습니다 (전체 공개)"); };
    $("btnSave").onclick = saveLimits;
  }

  async function setSetting(key, value, msg){
    var r = await sb.from("app_settings").update({value:value, updated_at:new Date().toISOString()}).eq("key",key).select();
    if(r.error){ toast("실패: "+r.error.message); return; }
    toast(msg); loadAll();
  }
  async function saveLimits(){
    var g = $("inGlobal").value, u = $("inUser").value, b = $("inBudget").value;
    var ups = [
      sb.from("app_settings").update({value:String(g),updated_at:new Date().toISOString()}).eq("key","BAIDU_DAILY_GLOBAL_CALL_LIMIT"),
      sb.from("app_settings").update({value:String(u),updated_at:new Date().toISOString()}).eq("key","BAIDU_PER_USER_DAILY_CALL_LIMIT"),
      sb.from("app_settings").update({value:String(b),updated_at:new Date().toISOString()}).eq("key","BAIDU_MONTHLY_BUDGET_CNY")
    ];
    var res = await Promise.all(ups);
    var bad = res.find(function(x){return x.error;});
    if(bad){ toast("저장 실패: "+bad.error.message); return; }
    toast("한도·예산을 저장했습니다"); loadAll();
  }

  (async function(){
    if(window.renderHeader) try{ await renderHeader("admin"); }catch(e){}
    if(window.renderFooter) try{ renderFooter(); }catch(e){}
    var user = window.requireLogin ? await requireLogin() : null;
    if(!window.sb){ $("content").innerHTML='<p class="muted">설정을 불러오지 못했습니다.</p>'; return; }
    if(!user) return;
    var adm = window.isAdmin ? await isAdmin(user) : false;
    if(!adm){ $("content").innerHTML='<div class="card"><h2>🔒 관리자 전용</h2><p class="muted">이 페이지는 인비랩 운영자만 볼 수 있어요.</p></div>'; return; }
    loadAll();
  })();
})();
</script>
</body>
</html>
