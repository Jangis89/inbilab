<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인터넷 연결 필요 — 인비랩</title>
<style>
  body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;
       min-height:100vh;text-align:center;padding:24px;}
  .box{max-width:340px;}
  .logo{font-size:30px;font-weight:800;color:#2563eb;margin-bottom:18px;}
  .logo span{color:#0f172a;}
  h1{font-size:22px;margin:0 0 10px;}
  p{font-size:16px;color:#475569;line-height:1.6;margin:0 0 24px;}
  button{background:#2563eb;color:#fff;border:0;border-radius:12px;
         font-size:17px;font-weight:700;padding:14px 34px;cursor:pointer;}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">인비<span>랩</span></div>
    <h1>인터넷 연결이 필요해요</h1>
    <p>지금 인터넷에 연결되어 있지 않습니다.<br>와이파이나 데이터를 켠 뒤 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
